name: Test Chart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-chart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KIND_CLUSTER_NAME: test-chart
      KIND_VERSION: v0.26.0
      KIND_NODE_IMAGE: kindest/node:v1.32.0
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.3.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: |
          kind create cluster --name "${KIND_CLUSTER_NAME}" --image "${KIND_NODE_IMAGE}" --wait 120s

      - name: Setup authentication for private Go modules
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "machine github.com login $GH_ACTOR password $GH_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          git config --global url."https://${GH_ACTOR}:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Prepare opg-ewbi
        run: |
          go mod tidy
          make docker-build IMG=opg-ewbi:v0.1.0 PLATFORM=linux/amd64
          kind load docker-image opg-ewbi:v0.1.0 --name "${KIND_CLUSTER_NAME}"

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart

      - name: Install Helm chart for project
        run: |
          helm install my-release ./dist/chart \
            --create-namespace \
            --namespace opg-ewbi-system \
            --set crd.enabled=true \
            --set crd.enable=true

      - name: Check Helm release status
        run: |
          helm status my-release --namespace opg-ewbi-system

      - name: Tear down kind cluster
        if: always()
        run: |
          kind delete cluster --name "${KIND_CLUSTER_NAME}" || true
