apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: opg-ewbi-operator
    control-plane: controller-manager
  name: opg-ewbi-operator-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: applicationdeployments.opg.ewbi.katalis.com
spec:
  group: opg.ewbi.katalis.com
  names:
    kind: ApplicationDeployment
    listKind: ApplicationDeploymentList
    plural: applicationdeployments
    shortNames:
    - appdep
    singular: applicationdeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.relationType
      name: relationType
      type: string
    - jsonPath: .spec.federationContextId
      name: federationContextId
      type: string
    - jsonPath: .spec.appId
      name: appId
      type: string
    - jsonPath: .spec.zoneId
      name: zoneId
      type: string
    - jsonPath: .spec.appInstanceId
      name: appInstanceId
      type: string
    - jsonPath: .status.appInstanceInfo.appInstanceState
      name: state
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: ApplicationDeployment is the Schema for the applicationdeployments
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplicationDeploymentSpec defines the desired state of ApplicationDeployment
            properties:
              appDetails:
                description: AppDetails defines the application details
                properties:
                  appInstCallbackLink:
                    type: string
                  appVersion:
                    description: Version info of the application
                    type: string
                  zoneInfo:
                    description: ZoneInfo defines the zone information for the application
                    properties:
                      flavourId:
                        description: An identifier to refer to a specific combination
                          of compute resources
                        type: string
                      resPool:
                        description: Resource pool to be used for application instantiation
                          on this zone.  Valid only if IE 'resourceConsumption' is
                          set to 'RESERVED_RES_SHALL' or 'RESERVED_RES_PREFER'
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_]{6,30}[A-Za-z0-9]$
                        type: string
                      resourceConsumption:
                        default: RESERVED_RES_AVOID
                        description: Specifies if the application can be instantiated
                          using pre-reserved resource or not.  App provider can pre-reserve
                          a pool of compute resource on each zone.  'RESERVED_RES_SHALL'
                          instruct OP to use only the pre-reserved resources. 'RESERVED_RES_PREFER'
                          instruct to first try using pre-reserved resource, if none
                          available go for non-reserved resources. 'RESERVED_RES_AVOID'
                          instruct OP not to use pre-reserved resource if possible,
                          it is a choice depending upon circumstances 'RESERVED_RES_FORBID'
                          instruct OP not to use pre-reserved resources.
                        enum:
                        - RESERVED_RES_SHALL
                        - RESERVED_RES_PREFER
                        - RESERVED_RES_AVOID
                        - RESERVED_RES_FORBID
                        type: string
                    type: object
                required:
                - appVersion
                - zoneInfo
                type: object
              appId:
                description: Identifier used to refer to an application.
                pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                type: string
              appInstanceId:
                description: Unique identifier generated by the partner OP to identify
                  an instance of the application on a specific zone.
                pattern: ^[A-Za-z0-9][A-Za-z0-9_]{6,62}[A-Za-z0-9]$
                type: string
              appProviderId:
                description: UserId of the app provider.  Identifier is relevant only
                  in context of this federation.
                pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                type: string
              federationContextId:
                description: This identifier shall be provided by the partner OP on
                  successful verification and validation of the federation create
                  request and is used by partner op to identify this newly created
                  federation context. Originating OP shall provide this identifier
                  in any subsequent request towards the partner op.
                pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
                type: string
              relationType:
                enum:
                - HOST
                - GUEST
                type: string
              transactionId:
                description: A unique transaction id for this request in UUID format.
                  It is used for tracking the request
                format: uuid
                type: string
              zoneId:
                description: Human readable name of the zone.
                pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
                type: string
            required:
            - appDetails
            - appId
            - appInstanceId
            - appProviderId
            - federationContextId
            - relationType
            - zoneId
            type: object
          status:
            description: ApplicationDeploymentStatus defines the observed state of
              ApplicationDeployment.
            properties:
              accessPointInfo:
                description: Information about the IP and Port exposed by the OP.
                  Application clients shall use these access points to reach this
                  application instance
                items:
                  properties:
                    accessPoints:
                      properties:
                        fqdn:
                          description: DNS FQDN assigned to application instances
                            in an availability zone. User Clients can resolve the
                            FQDN to communicate with the edge instances of the application
                          type: string
                        ipv4Addresses:
                          items:
                            type: string
                          minItems: 1
                          type: array
                        ipv6Addresses:
                          items:
                            format: ipv6
                            pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))$
                            type: string
                          minItems: 1
                          type: array
                        port:
                          minimum: 0
                          type: integer
                      required:
                      - port
                      type: object
                      x-kubernetes-validations:
                      - message: at least one among fqdn, ipv4Addresses, ipv6Addresses
                          must be set
                        rule: has(self.fqdn) || has(self.ipv4Addresses) || has(self.ipv6Addresses)
                    interfaceId:
                      description: This is the interface identifier that app provider
                        defines when application is onboarded.
                      pattern: ^[A-Za-z0-9][A-Za-z0-9_]{6,30}[A-Za-z0-9]$
                      type: string
                  required:
                  - accessPoints
                  - interfaceId
                  type: object
                minItems: 1
                type: array
              appInstanceInfo:
                properties:
                  appInstIdentifier:
                    description: Unique identifier generated by the partner OP to
                      identify an instance of the application on a specific zone.
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_]{6,62}[A-Za-z0-9]$
                    type: string
                  appInstanceState:
                    description: Running status of the application instance.
                    enum:
                    - PENDING
                    - READY
                    - FAILED
                    - TERMINATING
                    type: string
                required:
                - appInstanceState
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: applicationonboardings.opg.ewbi.katalis.com
spec:
  group: opg.ewbi.katalis.com
  names:
    kind: ApplicationOnboarding
    listKind: ApplicationOnboardingList
    plural: applicationonboardings
    shortNames:
    - apponb
    singular: applicationonboarding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.relationType
      name: relationType
      type: string
    - jsonPath: .spec.federationContextId
      name: federationContextId
      type: string
    - jsonPath: .spec.appInfo.appId
      name: appId
      type: string
    - jsonPath: .spec.appInfo.appProviderId
      name: appProvider
      type: string
    - jsonPath: .status.state
      name: state
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: ApplicationOnboarding is the Schema for the applicationonboardings
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplicationOnboardingSpec defines the desired state of ApplicationOnboarding
            properties:
              appInfo:
                description: Details about application compute resource requirements,
                  associated artefacts, QoS profile and regions where application
                  shall be made available etc.
                properties:
                  appComponentSpecs:
                    items:
                      properties:
                        artefactId:
                          description: A globally unique identifier associated with
                            the artefact. Originating OP generates this identifier
                            when artefact is submitted over NBI.
                          format: uuid
                          type: string
                        componentName:
                          description: Must be a valid RFC 1035 label name.  Component
                            name must be unique with an application
                          pattern: ^[A-Za-z0-9][A-Za-z0-9_]{6,62}[A-Za-z0-9]$
                          type: string
                        serviceNameEW:
                          description: Must be a valid RFC 1035 label name. This defines
                            the DNS name via which the component can be accessed via
                            peer components. Access via serviceNameEW is open on all
                            ports.   Platform shall not expose serviceNameEW externally
                            outside edge.
                          pattern: ^(([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9])\.)*([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9])$
                          type: string
                        serviceNameNB:
                          description: Must be a valid RFC 1035 label name. This defines
                            the DNS name via which the component can be accessed over
                            NBI. Access via     serviceNameNB is restricted on specific
                            ports. Platform shall expose component access externally
                            via this DNS name
                          pattern: ^(([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9])\.)*([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9])$
                          type: string
                      type: object
                    minItems: 1
                    type: array
                  appDeploymentZones:
                    description: Details about partner OP zones where the application
                      should be made available;  This field when specified will instruct
                      the OP to restrict application instantiation only on the listed
                      zones.
                    items:
                      properties:
                        countryCode:
                          description: ISO 3166-1 Alpha-2 code for the country of
                            Partner operator
                          pattern: ^[A-Z]{2}$
                          type: string
                        zoneId:
                          description: Human readable name of the zone.
                          pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
                          type: string
                      type: object
                    minItems: 1
                    type: array
                  appId:
                    description: Identifier used to refer to an application.
                    pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                    type: string
                  appMetaData:
                    description: Application metadata details
                    properties:
                      accessToken:
                        description: An application Access key, to be used with UNI
                          interface to authorize UCs Access to a given application
                        type: string
                      appDescription:
                        description: Brief application description provided by application
                          provider
                        maxLength: 256
                        minLength: 16
                        type: string
                      appName:
                        description: Name of the application. Application provider
                          define a human readable name for the application
                        pattern: ^[A-Za-z][A-Za-z0-9_]{7,31}$
                        type: string
                      category:
                        description: Possible categorization of the application
                        enum:
                        - IOT
                        - HEALTH_CARE
                        - GAMING
                        - VIRTUAL_REALITY
                        - SOCIALIZING
                        - SURVEILLANCE
                        - ENTERTAINMENT
                        - CONNECTIVITY
                        - PRODUCTIVITY
                        - SECURITY
                        - INDUSTRIAL
                        - EDUCATION
                        - OTHERS
                        type: string
                      mobilitySupport:
                        default: false
                        description: Indicates if an application is sensitive to user
                          mobility and can be relocated. Default is "FALSE"
                        type: boolean
                      version:
                        description: Version info of the application
                        type: string
                    required:
                    - accessToken
                    - appName
                    - version
                    type: object
                  appProviderId:
                    description: UserId of the app provider.  Identifier is relevant
                      only in context of this federation.
                    pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                    type: string
                  appQoSProfile:
                    description: Parameters corresponding to the performance constraints,
                      tenancy details etc.
                    properties:
                      appProvisioning:
                        default: true
                        description: Define if application can be instantiated or
                          not
                        type: boolean
                      bandwidthRequired:
                        description: Data transfer bandwidth requirement (minimum
                          limit) for the application. It should in Mbits/sec
                        format: int32
                        minimum: 1
                        type: integer
                      latencyConstraints:
                        description: Latency requirements for the application.Allowed
                          values (non-standardized) are none, low and ultra-low. Ultra-Low
                          may corresponds to range 15 - 30 msec, Low correspond to
                          range 30 - 50 msec. None means 51 and above
                        enum:
                        - NONE
                        - LOW
                        - ULTRALOW
                        type: string
                      multiUserClients:
                        description: Single user type application are designed to
                          serve just one client. Multi user type application is designed
                          to serve multiple clients
                        enum:
                        - APP_TYPE_SINGLE_USER
                        - APP_TYPE_MULTI_USER
                        type: string
                      noOfUsersPerAppInst:
                        default: 1
                        description: Maximum no of clients that can connect to an
                          instance of this application. This parameter is relevant
                          only for application of type multi user
                        type: integer
                    required:
                    - latencyConstraints
                    type: object
                  appStatusCallbackLink:
                    type: string
                  edgeAppFQDN:
                    description: DNS FQDN assigned to application instances in an
                      availability zone. User Clients can resolve the FQDN to communicate
                      with the edge instances of the application
                    type: string
                  onboardStatusInfo:
                    description: Defines change in application status. This change
                      could be related to application itself or an application instance
                      status
                    enum:
                    - PENDING
                    - ONBOARDED
                    - DEBOARDING
                    - REMOVED
                    - FAILED
                    type: string
                required:
                - appId
                type: object
              federationContextId:
                description: This identifier shall be provided by the partner OP on
                  successful verification and validation of the federation create
                  request and is used by partner op to identify this newly created
                  federation context. Originating OP shall provide this identifier
                  in any subsequent request towards the partner op.
                pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
                type: string
              relationType:
                enum:
                - HOST
                - GUEST
                type: string
              zoneSettings:
                items:
                  properties:
                    forbid:
                      description: Value 'true' will forbid application instantiation
                        on this zone.  No new instance of the application can be created
                        on this zone.
                      type: boolean
                    zoneId:
                      items:
                        description: Human readable name of the zone.
                        pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
                        type: string
                      minItems: 1
                      type: array
                  type: object
                minItems: 1
                type: array
            required:
            - appInfo
            - federationContextId
            - relationType
            type: object
          status:
            description: ApplicationOnboardingStatus defines the observed state of
              ApplicationOnboarding.
            properties:
              lastUpdated:
                description: Timestamp of the last status update
                format: date-time
                type: string
              message:
                description: Message indicating details about the current state
                type: string
              state:
                description: Current state of the artefact upload
                enum:
                - PENDING
                - ONBOARDED
                - REMOVED
                - FAILED
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: artefacts.opg.ewbi.katalis.com
spec:
  group: opg.ewbi.katalis.com
  names:
    kind: Artefact
    listKind: ArtefactList
    plural: artefacts
    shortNames:
    - art
    singular: artefact
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.relationType
      name: relationType
      type: string
    - jsonPath: .spec.federationContextId
      name: federationContextId
      type: string
    - jsonPath: .spec.artefactId
      name: artefactId
      type: string
    - jsonPath: .status.state
      name: state
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Artefact is the Schema for the artefacts API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ArtefactSpec defines the desired state of Artefact
            properties:
              artefactBody:
                properties:
                  appProviderId:
                    description: UserId of the app provider.  Identifier is relevant
                      only in context of this federation.
                    pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                    type: string
                  artefactDescription:
                    description: Brief description of the artefact by the application
                      provider
                    maxLength: 256
                    type: string
                  artefactDescriptorType:
                    description: Type of descriptor present in the artefact.  App
                      provider can either define either a Helm chart or a Terraform
                      script or container spec.
                    enum:
                    - HELM
                    - TERRAFORM
                    - ANSIBLE
                    - SHELL
                    - COMPONENTSPEC
                    type: string
                  artefactFileFormat:
                    description: Artefacts like Helm charts or Terraform scripts may
                      need compressed format.
                    enum:
                    - ZIP
                    - TAR
                    - TEXT
                    - TARGZ
                    type: string
                  artefactFileName:
                    description: Name of the file.
                    maxLength: 32
                    minLength: 8
                    type: string
                  artefactName:
                    description: Name of the artefact.
                    pattern: ^[A-Za-z][A-Za-z0-9_]{7,31}$
                    type: string
                  artefactRepoLocation:
                    properties:
                      password:
                        description: Password to access the repository
                        type: string
                      repoURL:
                        type: string
                      token:
                        description: Authorization token to access the repository
                        type: string
                      userName:
                        description: Username to access the repository
                        type: string
                    type: object
                  artefactVersionInfo:
                    description: Artefact version information
                    type: string
                  artefactVirtType:
                    enum:
                    - VM_TYPE
                    - CONTAINER_TYPE
                    type: string
                  componentSpec:
                    description: Details about compute, networking and storage requirements
                      for each component of the application. App provider should define
                      all information needed to instantiate the component. If artefact
                      is being defined at component level this section should have
                      information just about the component. In case the artefact is
                      being defined at application level the section should provide
                      details about all the components.
                    items:
                      properties:
                        commandLineParams:
                          description: List of commands and arguments that shall be
                            invoked when the component instance is created. This is
                            valid only for container based deployment.
                          properties:
                            command:
                              description: List of commands that application should
                                invoke when an instance is created.
                              items:
                                type: string
                              type: array
                            commandArgs:
                              description: List of arguments required by the command.
                              items:
                                type: string
                              type: array
                          required:
                          - command
                          type: object
                        compEnvParams:
                          items:
                            description: Environment variables are key value pairs
                              that should be injected when component in instantiated
                            properties:
                              envValueType:
                                enum:
                                - USER_DEFINED
                                - PLATFORM_DEFINED_DYNAMIC_PORT
                                - PLATFORM_DEFINED_DNS
                                - PLATFORM_DEFINED_IP
                                type: string
                              envVarName:
                                description: Name of environment variable
                                pattern: ^[A-Za-z0-9][A-Za-z0-9_]{6,30}[A-Za-z0-9]$
                                type: string
                              envVarSrc:
                                description: Full path of parameter from componentSpec
                                  that should be used to generate the environment
                                  value. Eg. networkResourceProfile. interfaceId.
                                type: string
                              envVarValue:
                                description: Value to be assigned to environment variable
                                pattern: ^[A-Za-z0-9][A-Za-z0-9_]{6,62}[A-Za-z0-9]$
                                type: string
                            required:
                            - envValueType
                            - envVarName
                            type: object
                          type: array
                        componentName:
                          description: Must be a valid RFC 1035 label name.  Component
                            name must be unique with an application
                          pattern: ^[A-Za-z0-9][A-Za-z0-9_]{6,62}[A-Za-z0-9]$
                          type: string
                        computeResourceProfile:
                          properties:
                            cpuArchType:
                              type: string
                            cpuExclusivity:
                              type: boolean
                            memory:
                              format: int64
                              type: integer
                            numCPU:
                              type: string
                          type: object
                        deploymentConfig:
                          description: Configuration used when deploying a component.
                            May override other ComponentSpec parameters related to
                            deployment like restart policy, command line parameters,
                            environment variables, etc.
                          properties:
                            configType:
                              description: Config type.
                              enum:
                              - DOCKER_COMPOSE
                              - KUBERNETES_MANIFEST
                              - CLOUD_INIT
                              - HELM_VALUES
                              type: string
                            contents:
                              description: Contents of the configuration.
                              type: string
                          required:
                          - configType
                          - contents
                          type: object
                        exposedInterfaces:
                          description: Each application component exposes some ports
                            either for external users or for inter component communication.
                            Application provider is required to specify which ports
                            are to be exposed and the type of traffic that will flow
                            through these ports.
                          items:
                            properties:
                              interfaceId:
                                type: string
                              port:
                                format: int32
                                type: integer
                              protocol:
                                type: string
                              visibilityType:
                                type: string
                            type: object
                          minItems: 1
                          type: array
                        images:
                          description: List of all images associated with the component.
                            Images are specified using the file identifiers. Partner
                            OP provides these images using file upload api.
                          items:
                            type: string
                          minItems: 1
                          type: array
                        numOfInstances:
                          description: Number of component instances to be launched.
                          format: int32
                          type: integer
                        persistentVolumes:
                          description: The ephemeral volume a container process may
                            need to temporary store internal data
                          items:
                            properties:
                              accessMode:
                                default: RW
                                description: Values are RW (read/write) and RO (read-only)
                                enum:
                                - RW
                                - RO
                                type: string
                              ephemeralType:
                                default: false
                                description: It indicates the ephemeral storage on
                                  the node and contents are not preserved if containers
                                  restarts
                                type: boolean
                              sharingPolicy:
                                default: EXCLUSIVE
                                description: Exclusive or Shared. If shared, then
                                  in case of multiple containers same volume will
                                  be shared across the containers.
                                enum:
                                - EXCLUSIVE
                                - SHARED
                                type: string
                              volumeMountPath:
                                description: Defines the mount path of the volume
                                type: string
                              volumeName:
                                description: Human readable name for the volume
                                type: string
                              volumeSize:
                                description: Size of the volume given by user (10GB,
                                  20GB, 50 GB or 100GB)
                                enum:
                                - 10Gi
                                - 20Gi
                                - 50Gi
                                - 100Gi
                                type: string
                            required:
                            - volumeMountPath
                            - volumeName
                            - volumeSize
                            type: object
                          minItems: 1
                          type: array
                        restartPolicy:
                          description: How the platform shall handle component failure
