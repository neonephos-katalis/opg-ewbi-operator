              relationType:
                enum:
                - HOST
                - GUEST
                type: string
            required:
            - artefactId
            - federationContextId
            - relationType
            type: object
          status:
            description: ArtefactStatus defines the observed state of Artefact.
            properties:
              lastUpdated:
