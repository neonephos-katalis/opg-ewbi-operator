# [MANAGER]: Manager Deployment Configurations
manager:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/neonephos-katalis/katalis/fm-operator
    tag: v1.1.0
    pullPolicy: Always
  args:
    - "--leader-elect"
  opgInsecureSkipVerify: false
  env:
    - name: NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  imagePullSecrets:
    - name: opg-registry-secret
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  affinity: {}
  nodeSelector: {}
  tolerations: []
  terminationGracePeriodSeconds: 10

federation:
  enable: true
  replicas: 1
  image:
    repository: ghcr.io/neonephos-katalis/katalis/fm-api
    tag: v1.1.0
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
  terminationGracePeriodSeconds: 10
  log:
    level: "info"
  externalServices:
    hydra:
      name: katalis-fm-hydra-admin
      port: 4445
    userBuster:
      name: katalis-fm-user-buster
      port: 80
  services:
    federation:
      name: katalis-fm-api
      port: 8080
      # nodePort: 30081  # Optional: specify a specific nodePort (30000-32767), or leave empty for auto-assignment

fullnameOverride: katalis-fm

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  namespaced: false
  helpers:
    enabled: false

serviceAccount:
  enabled: true

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enabled: false

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
metrics:
  enabled: false
  port: 8443
  secure: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enabled: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certManager:
  enabled: false

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enabled: false

clusterWide: false
