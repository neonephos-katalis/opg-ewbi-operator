apiVersion: rbac.authorization.k8s.io/v1
{{- if (not .Values.clusterWide) }}
kind: RoleBinding
{{- else }}
kind: ClusterRoleBinding
{{- end }}
metadata:
{{- if (not .Values.clusterWide) }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "opg-ewbi.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "opg-ewbi.resourceName" (dict "suffix" (printf "%s-%s" "manager-rolebinding" $.Release.Namespace) "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  {{- if (not .Values.clusterWide) }}
  kind: Role
  {{- else }}
  kind: ClusterRole
  {{- end }}
  name: {{ include "opg-ewbi.resourceName" (dict "suffix" (printf "%s-%s" "manager-role" $.Release.Namespace) "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "opg-ewbi.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
