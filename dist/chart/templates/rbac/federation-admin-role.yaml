{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: opg-ewbi
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "opg-ewbi.resourceName" (dict "suffix" (printf "%s-%s" "federation-admin-role" $.Release.Namespace) "context" $) }}
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - opg.ewbi.katalis.com
  resources:
  - federations
  verbs:
  - '*'
- apiGroups:
  - opg.ewbi.katalis.com
  resources:
  - federations/status
  verbs:
  - get
{{- end }}
