{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: opg-ewbi-manager-role-{{ .Release.Namespace }}
rules:
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingadmissionpolicies
  - validatingadmissionpolicybindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opg-ewbi-manager-role-{{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - opg.ewbi.katalis.com
  resources:
  - applicationdeployments
  - applicationonboardings
  - artefacts
  - availabilityzones
  - consumptionmonitorings
  - federations
  - images
  verbs:
  - '*'
- apiGroups:
  - opg.ewbi.katalis.com
  resources:
  - applicationdeployments/finalizers
  - applicationonboardings/finalizers
  - artefacts/finalizers
  - availabilityzones/finalizers
  - consumptionmonitorings/finalizers
  - federations/finalizers
  - images/finalizers
  verbs:
  - update
- apiGroups:
  - opg.ewbi.katalis.com
  resources:
  - applicationdeployments/status
  - applicationonboardings/status
  - artefacts/status
  - availabilityzones/status
  - consumptionmonitorings/status
  - federations/status
  - images/status
  verbs:
  - get
  - patch
  - update
{{- end -}}
