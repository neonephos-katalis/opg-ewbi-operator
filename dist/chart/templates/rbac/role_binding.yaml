{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.clusterWide }}ClusterRoleBinding{{ else }}RoleBinding{{ end }}
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: opg-ewbi-manager-rolebinding{{ if .Values.clusterWide }}-{{ .Release.Namespace }}{{ end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.clusterWide }}ClusterRole{{ else }}Role{{ end }}
  name: opg-ewbi-manager-role-{{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.controllerManager.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
{{- end -}}
