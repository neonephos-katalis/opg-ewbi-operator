{{- if and .Values.metrics.enabled .Values.metrics.secure }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opg-ewbi.resourceName" (dict "suffix" (printf "%s-%s" "metrics-auth-rolebinding" $.Release.Namespace) "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opg-ewbi.resourceName" (dict "suffix" (printf "%s-%s" "metrics-auth-role" $.Release.Namespace) "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "opg-ewbi.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
