---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: federations.opg.ewbi.katalis.com
spec:
  group: opg.ewbi.katalis.com
  names:
    kind: Federation
    listKind: FederationList
    plural: federations
    shortNames:
    - fed
    singular: federation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.federationData.relationType
      name: relationType
      type: string
    - jsonPath: .spec.federationData.technologyType
      name: technologyType
      type: string
    - jsonPath: .spec.federationData.initialDate
      name: initialDate
      type: string
    - jsonPath: .status.federationContextId
      name: federationContextId
      type: string
    - jsonPath: .status.partnerOPFederationId
      name: partnerOPFederationId
      type: string
    - jsonPath: .status.state
      name: state
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Federation is the Schema for the federations API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FederationSpec defines the desired state of Federation
            properties:
              capType:
                description: The enumerated list of network capabilities that an OP
                  can use for various services via SBI-NR.
                enum:
                - NW_CAP_CONN_STATE_CHANGE
                - NW_CAP_LOCATION_RETRIEVAL
                - NW_CAP_USERPLANE_MGMT_EVENTS
                - NW_CAP_DYNAMIC_QOS
                type: string
              federationData:
                properties:
                  clientId:
                    type: string
                  clientSecret:
                    type: string
                  initialDate:
                    description: |-
                      Initial Date and time, time zone info of the federation initiated by the Originating OP
                      e.g. "2025-01-10T09:50:32.571Z"
                    format: date-time
                    type: string
                  k8sOptions:
                    properties:
                      contextName:
                        type: string
                      namespace:
                        type: string
                      secretName:
                        type: string
                    required:
                    - namespace
                    type: object
                  origOPCountryCode:
                    description: ISO 3166-1 Alpha-2 code for the country of Partner
                      operator
                    pattern: ^[A-Z]{2}$
                    type: string
                  origOPFederationId:
                    description: Globally unique identifier allocated to an operator
                      platform. This is valid and used only in context of MEC federation
                      interface.
                    pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
                    type: string
                  relationType:
                    enum:
                    - HOST
                    - GUEST
                    type: string
                  restOptions:
                    properties:
                      partnerStatusLink:
                        pattern: ^https?://[^\s/$.?#].[^\s]*$
                        type: string
                      tokenUrl:
                        pattern: ^https?://[^\s/$.?#].[^\s]*$
                        type: string
                    required:
                    - partnerStatusLink
                    type: object
                  technologyType:
                    enum:
                    - K8S
                    - REST
                    type: string
                required:
                - initialDate
                - relationType
                - technologyType
                type: object
                x-kubernetes-validations:
                - message: If technologyType is 'REST', restOptions must be specified
                    and k8sOptions must be omitted
                  rule: 'self.technologyType == ''REST'' ? has(self.restOptions) &&
                    !has(self.k8sOptions) : true'
                - message: If technologyType is 'K8S', k8sOptions must be specified
                    and restOptions must be omitted
                  rule: 'self.technologyType == ''K8S'' ? has(self.k8sOptions) &&
                    !has(self.restOptions) : true'
                - message: technologyType is required to set restOptions or k8sOptions
                  rule: '!has(self.technologyType) || size(self.technologyType) ==
                    0 ? !has(self.restOptions) && !has(self.k8sOptions) : true'
                - message: clientId is required for GUEST
                  rule: '(has(self.relationType) && self.relationType == ''GUEST'')
                    ? (has(self.clientId) && self.clientId.matches(''^[A-Za-z0-9][A-Za-z0-9-]*$''))
                    : true'
                - message: clientSecret is required for GUEST
                  rule: '(has(self.relationType) && self.relationType == ''GUEST'')
                    ? (has(self.clientSecret) && self.clientSecret.matches(''^[A-Za-z0-9][A-Za-z0-9-]*$''))
                    : true'
                - message: tokenUrl is required for GUEST federations using REST
                  rule: '(has(self.relationType) && self.relationType == ''GUEST''
                    && has(self.restOptions)) ? has(self.restOptions.tokenUrl) : true'
                - message: secretName in k8sOptions is required when relationType
                    is GUEST
                  rule: 'self.relationType == ''GUEST'' && has(self.k8sOptions) ?
                    has(self.k8sOptions.secretName) && size(self.k8sOptions.secretName)
                    > 0 : true'
                - message: contextName in k8sOptions is required when relationType
                    is GUEST
                  rule: 'self.relationType == ''GUEST'' && has(self.k8sOptions) ?
                    has(self.k8sOptions.contextName) && size(self.k8sOptions.contextName)
                    > 0 : true'
              fixedNetworkIds:
                description: List of network identifier associated with the fixedline
                  network of the operator platform.
                items:
                  type: string
                minItems: 1
                type: array
              mobileNetworkIds:
                properties:
                  mcc:
                    pattern: ^\d{3}$
                    type: string
                  mncs:
                    items:
                      pattern: ^\d{2,3}$
                      type: string
                    minItems: 1
                    type: array
                type: object
              updateData:
                properties:
                  addFixedNetworkIds:
                    items:
                      type: string
                    type: array
                  addMobileNetworkIds:
                    properties:
                      mcc:
                        pattern: ^\d{3}$
                        type: string
                      mncs:
                        items:
                          pattern: ^\d{2,3}$
                          type: string
                        minItems: 1
                        type: array
                    type: object
                  assocAppPolicies:
                    properties:
                      appIdList:
                        description: AppIdList
                        properties:
                          appId:
                            description: (AppIdentifier) Identifier used to refer
                              to an application.
                            pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                            type: string
                          appProvId:
                            description: (AppProviderId) UserId of the app provider.  Identifier
                              is relevant only in context of this federation.
                            pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                            type: string
                          zoneIds:
                            description: (ZoneIdentifier) Human readable name of the
                              zone.
                            items:
                              pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
                              type: string
                            minItems: 1
                            type: array
                        required:
                        - appId
                        - appProvId
                        type: object
                      policyId:
                        description: (ApplPolicyIdentifier) Application-level Policy
                          unique identifier"
                        pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                        type: string
                    required:
                    - appIdList
                    - policyId
                    type: object
                  assocOpsPolicies:
                    properties:
                      appIdList:
                        description: AppIdList
                        properties:
                          appId:
                            description: (AppIdentifier) Identifier used to refer
                              to an application.
                            pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                            type: string
                          appProvId:
                            description: (AppProviderId) UserId of the app provider.  Identifier
                              is relevant only in context of this federation.
                            pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                            type: string
                          zoneIds:
                            description: (ZoneIdentifier) Human readable name of the
                              zone.
                            items:
                              pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
                              type: string
                            minItems: 1
                            type: array
                        required:
                        - appId
                        - appProvId
                        type: object
                      policyId:
                        description: (ApplPolicyIdentifier) Application-level Policy
                          unique identifier"
                        pattern: ^[A-Za-z][A-Za-z0-9_]{7,63}$
                        type: string
                    required:
                    - appIdList
                    - policyId
                    type: object
                  modificationDate:
                    description: Date and time of the federation modification by the
                      originating partner OP
                    format: date-time
                    type: string
                  objectType:
                    enum:
                    - MOBILE_NETWORK_CODES
                    - FIXED_NETWORK_CODES
                    - OPS_POLICY
                    - APP_POLICY
                    type: string
                  operationType:
                    enum:
                    - ADD_CODES
                    - REMOVE_CODES
                    - UPDATE_CODES
                    - ADD_POLICY
                    - REMOVE_POLICY
                    - UPDATE_POLICY
                    type: string
                  removeFixedNetworkIds:
                    items:
                      type: string
                    type: array
                  removeMobileNetworkIds:
                    properties:
                      mcc:
                        pattern: ^\d{3}$
                        type: string
                      mncs:
                        items:
                          pattern: ^\d{2,3}$
                          type: string
                        minItems: 1
                        type: array
                    type: object
                type: object
            required:
            - federationData
            type: object
          status:
            description: FederationStatus defines the observed state of Federation.
            properties:
              deviceConnStatusChangeCap:
                properties:
                  capabilityId:
                    description: The enumerated list of network capabilities that
                      an OP can use for various services via SBI-NR.
                    enum:
                    - NW_CAP_CONN_STATE_CHANGE
                    - NW_CAP_LOCATION_RETRIEVAL
                    - NW_CAP_USERPLANE_MGMT_EVENTS
                    - NW_CAP_DYNAMIC_QOS
