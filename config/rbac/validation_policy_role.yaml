apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opg-ewbi-manager-policy-{{ .Release.Namespace }}
rules:
- apiGroups:
    - admissionregistration.k8s.io
  resources:
    - validatingadmissionpolicies
    - validatingadmissionpolicybindings
  verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
